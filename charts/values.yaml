blocky:
  # --- Ressources ---
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # --- Service LoadBalancer avec IP fixe ---
  service:
    dns:
      type: LoadBalancer
      loadBalancerIP: "192.168.88.250"
      integrations:
        metallb:
          enabled: true
    # DNS (port 53 UDP/TCP), DoT (853), DoH (4443) sont déjà activés par défaut
    # k8sgateway (5353) aussi — désactive ce que tu n'utilises pas
  # --- Upstreams DNS (groupe "default") ---
  defaultUpstreams:
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query
    - https://dns.google/dns-query
  upstreamTimeout: 2s
  # --- Bootstrap DNS ---
  bootstrapDns:
    upstream: ""
    ips: []
  # --- Caching ---
  caching:
    prefetching: true
    prefetchExpires: 24h
    prefetchThreshold: 2
  # --- Blocage ---
  blocking:
    blockType: zeroIp
    blockTTL: 1m
    refreshPeriod: 6h
    downloadTimeout: 60s
    downloadAttempts: 5
    downloadCooldown: 10s
    processingConcurrency: 16
    startStrategy: fast
    maxErrorsPerSource: 5
    # Seulement ads & tracking (pas malicious/suspicious)
    clientGroupsBlock:
      - name: default
        groups:
          - default
          - default-ads
          - default-tracking
  # --- Désactive le query log PostgreSQL si tu n'en veux pas ---
  queryLog:
    type: ""
  cnpg:
    main:
      enabled: false
  redis:
    enabled: true
  # --- Config brute blocky (comble les trous non couverts par le template) ---
  blockyConfig:
    bootstrapDns:
      - 1.1.1.1
    upstreams:
      strategy: parallel_best
    customDNS:
      customTTL: 1h
      zone: |
        $ORIGIN home.
        * 3600 A 192.168.88.150
        @ 3600 A 192.168.88.150
        $ORIGIN mabbox.bytel.fr.
        * 3600 A 192.168.1.254
        @ 3600 A 192.168.1.254
        $ORIGIN EPSON2494BD.local.
        * 3600 A 192.168.20.10
        @ 3600 A 192.168.20.10
  configmap:
    datasource:
      enabled: false
    dashboard:
      enabled: false
