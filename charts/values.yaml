blocky-helm:
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

  replicaCount: 2
  service:
    enabled: true
    type: LoadBalancer
    loadBalancerIP: "192.168.88.250"

  # See https://0xerr0r.github.io/blocky/v0.23/configuration/ for all available options
  config:
    upstreams:
      groups:
        default:
          #- 1.1.1.1
          #- 8.8.8.8
          # DNS over HTTPS upstreams
          - https://1.1.1.1/dns-query
          - https://1.0.0.1/dns-query
          - https://dns.google/dns-query
          # DNS over TLS upstreams
          #- tcp-tls:dns.quad9.net
      # blocky will pick the 2 fastest upstreams but you can also use the `strict` strategy
      strategy: parallel_best
      timeout: 2s
    customDNS:
      customTTL: 1h
      zone: |
        $ORIGIN home.
        * 3600 A 192.168.88.150
        @ 3600 A 192.168.88.150

        $ORIGIN mabbox.bytel.fr.
        * 3600 A 192.168.1.254
        @ 3600 A 192.168.1.254
    prometheus:
      enable: true

    blocking:
      # I prefer the HaGeZi Light blocklist for set and forget setup, you can use any other blacklist nor whitelist you want
      # Blocky supports hosts, domains and regex syntax
      blackLists:
        default:
          - https://big.oisd.nl/domainswild
          - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
        default-ads:
          - https://adaway.org/hosts.txt
          - https://v.firebog.net/hosts/AdguardDNS.txt
          - https://v.firebog.net/hosts/Admiral.txt
          - https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt
          - https://v.firebog.net/hosts/Easylist.txt
          - https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext
          - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/UncheckyAds/hosts
          - https://raw.githubusercontent.com/bigdargon/hostsVN/master/hosts
        default-tracking:
          - https://v.firebog.net/hosts/Easyprivacy.txt
          - https://v.firebog.net/hosts/Prigent-Ads.txt
          - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.2o7Net/hosts
          - https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt
          - https://hostfiles.frogeye.fr/firstparty-trackers-hosts.txt
        default-malicious:
          - https://raw.githubusercontent.com/DandelionSprout/adfilt/master/Alternate%20versions%20Anti-Malware%20List/AntiMalwareHosts.txt
          - https://v.firebog.net/hosts/Prigent-Crypto.txt
          - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.Risk/hosts
          - https://bitbucket.org/ethanr/dns-blacklists/raw/8575c9f96e5b4a1308f2f12394abd86d0927a4a0/bad_lists/Mandiant_APT1_Report_Appendix_D.txt
          - https://phishing.army/download/phishing_army_blocklist_extended.txt
          - https://gitlab.com/quidsup/notrack-blocklists/raw/master/notrack-malware.txt
          - https://v.firebog.net/hosts/Prigent-Malware.txt
          # - https://v.firebog.net/hosts/RPiList-Malware.txt (see: https://github.com/0xERR0R/blocky/issues/1718 )
          # - https://v.firebog.net/hosts/RPiList-Phishing.txt (see: https://github.com/0xERR0R/blocky/issues/1718 )
          - https://raw.githubusercontent.com/Spam404/lists/master/main-blacklist.txt
          - https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/master/generated/hosts
          - https://urlhaus.abuse.ch/downloads/hostfile/
          # - https://lists.cyberhost.uk/malware.txt (see: https://github.com/0xERR0R/blocky/issues/950)
        default-suspicious:
          - https://raw.githubusercontent.com/PolishFiltersTeam/KADhosts/master/KADhosts.txt
          - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.Spam/hosts
          - https://v.firebog.net/hosts/static/w3kbl.txt
      clientGroupsBlock:
        default:
          - ads
          - tracking
      blockType: zeroIp
      blockTTL: 1m
      loading:
        refreshPeriod: 6h
        downloads:
          timeout: 60s
          attempts: 5
          cooldown: 10s
        concurrency: 16
        # start answering queries immediately after start
        strategy: fast
        maxErrorsPerSource: 5
    caching:
      # enable prefetching improves performance for often used queries
      prefetching: true
      # if a domain is queried more than prefetchThreshold times, it will be prefetched for prefetchExpires time
      prefetchExpires: 24h
      prefetchThreshold: 2

    # use encrypted DNS for resolving upstreams
    # same syntax as normal upstreams
    bootstrapDns:
      - 1.1.1.1

  ui:
    enabled: false
    # ingress:
    #   enabled: true
    #   annotations:
    #     cert-manager.io/cluster-issuer: letsencrypt

  #####################################################################################
  ### k8s-gateway SubChart
  #####################################################################################
  k8sGateway:
    enabled: false

    watchedResources:
      - "Ingress"
      - "Service"

    domain: ".home"

    # Optional configuration option for DNS01 challenge that will redirect all acme
    # challenge requests to external cloud domain (e.g. managed by cert-manager)
    # See: https://cert-manager.io/docs/configuration/acme/dns01/
    dnsChallenge:
      enabled: false
      domain: dns01.clouddns.com
